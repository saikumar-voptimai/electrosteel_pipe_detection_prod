# fps, conf thresholds, debounce frames, logging
video_source: "tests/videos/va_img_test3.avi"   # tests/videos/{video.mp4/.avi} | "gige"
model_path: "models/yolo/best_nano_dataset0To5.onnx"
tracker_yaml: "config/bytetrack.yaml"

degbug_mode: true

imgsz: 540 # Inference
conf: 0.25
iou: 0.5

max_fps: 18
frame_skip: 0                       # 0 = process every frame, 1 = every alternate, etc.

# Throttle non-inference logic (FSM updates, DB upserts, event handling).
# 0 = run every inference frame. Example: 6 means update pipe/gate logic at 6Hz
# while still running inference/tracking each processed frame.
update_fps: 6

log_level: "INFO"                   # DEBUG|INFO|WARNING|ERROR
log_path: "var/pipe_detect.log"     # e.g. "var/pipe_detect.log" (null = console only)

db_path: "var/pipes.db"
latest_jpg_path: "var/latest.jpg"
publish_fps: 1                      # UI refresh source
publish_imgsz: 540                  # max width/height of published image
db_flush_interval_s: 5.0            # batch DB commits for Pi
run_headless: true                  # disable display window

origin_confirm_frames: 5
loadcell_enter_confirm_frames: 3    # you said first entry; 2 is safer
loadcell_exit_confirm_frames: 3
stale_track_frames: 45
rearm_empty_frames: 10

gate:
  source_default: "geometry"        # plc | geometry | vision
  stable_frames: 3
  min_conf: 0.25
  max_area_ratio_vs_closed: 0.85
  max_w_over_h: 0.90
  human_iou_occlusion: 0.10